; W_MAP ESP32-S3 Motorcycle Navigation Display Firmware
; Supports ESP32-S3 boards with a 240x240 SPI display (GC9A01 circular or ST7789 square).
; Hardware pinout and display driver are isolated in `include/board_config.h`.

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.8.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DWMAP_TARGET_ESP32S3=1
lib_deps =
  h2zero/NimBLE-Arduino @ ^1.4.2

[env:native]
platform = native
build_flags =
  -std=c++17
test_build_src = no
